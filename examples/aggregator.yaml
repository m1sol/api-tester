auth:
  request:
    method: POST
    url: ${BASE_URL}/auth/login
    body:
      login: ${API_LOGIN}
      password: ${API_PASSWORD}
  extract:
    token: $.token

request:
  method: POST
  url: ${BASE_URL}/v2/analytics/get-data
  headers:
#    Authorization: Bearer ${auth.token}
    Content-Type: application/json
  body:
    type: TABLE_COLLECTION
    step: WEEKLY
    organizationId: ${ORG_ID}
    startDate: 2026-05-01T00:00:00.000000Z
    endDate: 2026-05-31T23:59:59.999999Z
    fields:
      - id: ${FIELD_ID}
        metricId: ${METRIC_ID}
        sort: 1
checks:
  - type: status_code
    expected: 200

  - type: json_path_exists
    path: $.step[*].year


  - type: json_path_count
    expected: 2
    path: $.step[*]

  - type: json_path_type
    path: $.metrics[*].tableField.values[*].fact
    expected: number

  - type: json_path_not_empty
    path: $.metrics

  - type: json_path_equals
    path: $.status
    expected: ok